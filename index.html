<!doctype html><html lang="ko"><head><meta name="author" content="체니"><meta name="copyright" content="© 2026 체니. All rights reserved."><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="only light"><meta name="theme-color" content="#123f47"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="물결항 낚시일지"><meta name="description" content="조선생과 떠나는 30개 낚시터. 캐스팅, 챔질, 보스와의 힘겨루기, 물고기 도감과 수족관을 즐겨요."><title>물결항 낚시일지</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/app-icon-192.png" type="image/png" sizes="192x192"><link rel="apple-touch-icon" href="assets/apple-touch-icon-180.png" sizes="180x180"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="v2.css"><link rel="stylesheet" href="effects.css"><link rel="stylesheet" href="touch-reel.css"><link rel="stylesheet" href="reel-feedback.css"><link rel="stylesheet" href="water-layout.css"><link rel="stylesheet" href="visual-refresh.css"><link rel="stylesheet" href="fishing-focus.css"><link rel="stylesheet" href="v3.css"><link rel="stylesheet" href="race.css"><link rel="stylesheet" href="race-paddock.css"><link rel="stylesheet" href="tournament.css"><link rel="stylesheet" href="town-harbor.css"><script type="module" src="fit-screen.js"></script><script type="module" src="app.js"></script></head>
<body><main class="town-view" id="game" aria-label="물결항 낚시일지">
 <header class="top"><div class="brand"><span class="brandmark">釣</span><div><small id="headerProgress">Lv.1 · EXP 0 / 200</small><div class="xp-track harbor-xp" aria-hidden="true"><i id="xpBar"></i></div><h1>물결항 <em>낚시일지</em></h1></div></div><button id="homeBtn" class="icon-button" aria-label="마을로 돌아가기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2"/><path d="M6 9.6V20h4.4v-5.4h3.2V20H18V9.6"/></svg></button><button id="settingsBtn" class="icon-button" aria-label="게임 설정"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.85 1.85M16.65 16.65l1.85 1.85M5.5 18.5l1.85-1.85M16.65 7.35l1.85-1.85"/><circle cx="12" cy="12" r="6.4"/></svg></button></header>
 <div class="wallet"><span><i class="coin">●</i> <b id="coins">0</b><small>금화</small></span><span id="debt" hidden></span><button id="bagBtn"><span class="mini-icon bucket"><svg class="harbor-nav-icon" width="17" height="17" aria-hidden="true"><use href="assets/harbor-icons.svg#tank"></use></svg></span><b id="bagCount">0 / 20</b><span>선상 수족관 ›</span></button></div>
 <section id="townMap" class="town-map" aria-labelledby="harborTitle">
  <div class="harbor-heading">
   <div class="harbor-title"><h2 id="harborTitle">물결항</h2><b id="playerBadge">초보 낚시꾼</b></div>
   <div class="harbor-health"><span id="townHP">체력 100 / 100</span></div>
  </div>
  <div class="harbor-board">
   <div class="harbor-chart">
    <button type="button" class="harbor-hotspot" data-town="shop" aria-label="장비 · 미끼"></button>
    <button type="button" class="harbor-hotspot" data-town="market" aria-label="물고기 시장"></button>
    <button type="button" class="harbor-hotspot" data-town="skills" aria-label="낚시 학교"></button>
    <button type="button" class="harbor-hotspot" data-town="tank" aria-label="내 수족관"></button>
    <button type="button" class="harbor-hotspot" data-town="restaurant" aria-label="바다 식당"></button>
    <button type="button" class="harbor-hotspot" data-town="home" aria-label="내 집"></button>
    <button type="button" class="harbor-hotspot" data-town="boats" aria-label="선박 거래소"></button>
    <button type="button" class="harbor-hotspot" data-town="race" aria-label="낚시배 레이스"></button>
    <button type="button" class="harbor-hotspot" data-town="map" aria-label="낚시 지도 · 출항"></button>
   </div>
  </div>
  <div class="harbor-facilities" role="group" aria-label="마을 시설">
   <button type="button" class="harbor-facility" data-town="skills"><span class="harbor-facility-icon" aria-hidden="true"><svg width="20" height="20" aria-hidden="true"><use href="assets/harbor-icons.svg#skills"></use></svg></span><span class="harbor-facility-text"><b>낚시 학교</b><small id="mapSP">스킬 배우기</small></span></button>
   <button type="button" class="harbor-facility" data-town="restaurant"><span class="harbor-facility-icon" aria-hidden="true"><svg width="20" height="20" aria-hidden="true"><use href="assets/harbor-icons.svg#restaurant"></use></svg></span><span class="harbor-facility-text"><b>바다 식당</b><small>음식 · 버프</small></span></button>
   <button type="button" class="harbor-facility" data-town="home"><span class="harbor-facility-icon" aria-hidden="true"><svg width="20" height="20" aria-hidden="true"><use href="assets/harbor-icons.svg#home"></use></svg></span><span class="harbor-facility-text"><b>내 집</b><small id="mapHome">단칸방 · 잠자기</small></span></button>
   <button type="button" class="harbor-facility" data-town="boats"><span class="harbor-facility-icon" aria-hidden="true"><svg width="20" height="20" aria-hidden="true"><use href="assets/harbor-icons.svg#boats"></use></svg></span><span class="harbor-facility-text"><b>선박 거래소</b><small>배 구입 · 판매</small></span></button>
   <button type="button" class="harbor-facility" data-town="race"><span class="harbor-facility-icon" aria-hidden="true"><svg width="20" height="20" aria-hidden="true"><use href="assets/harbor-icons.svg#race"></use></svg></span><span class="harbor-facility-text"><b>낚시배 레이스</b><small>대회 접수 · 부품점</small></span></button>
  </div>
  <div class="harbor-actions">
   <button id="autoPill" class="auto-pill" type="button" hidden></button>
   <button class="harbor-departure" data-town="map" type="button">
    <span class="harbor-departure-icon" aria-hidden="true"><svg width="24" height="24"><use href="assets/harbor-icons.svg#map"></use></svg></span><span><b>낚시 지도 · 출항</b><small id="mapBoat">조각배 · 20칸</small></span><span class="harbor-chevron" aria-hidden="true">›</span>
   </button>
  </div>
 </section>
 <section id="scene" class="scene" aria-label="낚시터">
  <div class="night-shade"></div><div class="scene-top"><div class="location"><small id="chapter">첫 번째 여행</small><b id="location">솔바람 개울</b></div><div class="scene-chips"><button id="clockBtn" class="weather">☀ 낮 · 산들바람</button><button id="mealBtn" class="meal-chip" aria-label="도시락 가방">🍙 식사</button><button id="autoBtn" class="meal-chip auto-chip" aria-label="자동 낚시">🤖 자동</button></div></div>
  <div id="questChip" class="quest-chip">첫 물고기를 만나 볼까요?</div>
  <div class="shore-glints" aria-hidden="true"></div><div class="ripples r1"></div><div class="ripples r2"></div><div id="bobber" class="bobber"><img src="assets/float.svg" alt="빨간 찌톱과 나무 몸통의 낚시찌" draggable="false"></div>
  <img class="hero" src="assets/hero-rear.png" alt="등을 보이고 앉아 수면을 바라보는 조선생" draggable="false">
  <svg class="fishing-line" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"><path id="fishingLine" d="M240 790 Q420 700 600 640"/></svg>
  <div id="wildFish" class="wild-fish"><div id="fishSprite" class="sprite"></div></div>
  <div id="fightTimer" class="fight-timer" hidden></div><div id="castGauge" class="cast-gauge" hidden><strong id="castLabel">방향 정하기</strong><div class="cast-track"><span class="perfect-zone"></span><i id="castNeedle"></i></div><small>초록 구간에서 누르면 더 정확해요</small></div>
  <div id="fightLabel" class="fight-label" hidden><span id="fishName">피라미</span><b id="fishDirection">→</b></div>
  <div id="tensionAlert" role="alert" aria-atomic="true"><strong id="tensionAlertTitle">줄이 팽팽해요</strong><span>손을 떼면 줄이 풀려요</span></div>
  <div id="combatEffects" class="combat-effects" aria-hidden="true"></div>
  <div id="sceneMessage" class="scene-message">물결 너머, 새로운 여행이 시작돼요.</div>
  <div id="autoOverlay" class="auto-overlay" hidden></div><button id="pauseOverlay" class="pause-overlay" hidden><b>잠깐 쉬는 중</b><span>눌러서 이어하기</span></button>
 </section>
 <div class="journey-row"><button id="baitBtn"><span id="baitText">🪱 기본 미끼</span><small>변경 ›</small></button><button id="bossBtn"><span>✦ 지역 의뢰</span><small id="bossHint">성장 목표</small></button></div>
 <section class="instruments"><div class="meter-row"><label>내 체력 <b id="heroValue">100</b><span class="bar"><i id="heroBar"></i></span></label><label>물고기 <b id="fishValue">—</b><span class="bar fish-bar"><i id="fishBar"></i></span></label></div><div class="tension"><span>줄 긴장</span><div class="bar"><i id="tensionBar"></i><span class="danger-mark"></span></div><b id="tensionValue">0%</b></div></section>
 <div class="active-skills" aria-label="장착 액티브 스킬"><button id="active0"><b>강타</b><small>미습득</small></button><button id="active1"><b>탄력</b><small>미습득</small></button><button id="active2"><b>충격</b><small>미습득</small></button></div>
 <div class="instruction" id="instruction" role="status">낚시 시작을 누르세요</div>
 <section class="controls" aria-label="낚시 조작"><button id="leftBtn" class="reel" aria-label="왼쪽으로 당기기"><b>◀</b><small>왼쪽 당기기</small></button><button id="actionBtn" class="action"><b>낚시 시작</b><small>방향 · 힘 · 챔질</small></button><button id="rightBtn" class="reel" aria-label="오른쪽으로 당기기"><b>▶</b><small>오른쪽 당기기</small></button><div class="reel-status" id="reelStatus" aria-live="off">줄 대기<small>수면 터치 → 감기</small></div><button id="skillBtn" class="skill" aria-label="스킬 학교"><span>✦</span><small>스킬</small><i id="skillFill"></i></button></section>
 <nav class="bottom-nav" aria-label="게임 메뉴"><button data-panel="town"><span class="nav-icon compass"><svg class="harbor-nav-icon" width="21" height="21" aria-hidden="true"><use href="assets/harbor-icons.svg#map"></use></svg></span><b>마을 지도</b></button><button data-panel="shop"><span class="nav-icon rod"><svg class="harbor-nav-icon" width="21" height="21" aria-hidden="true"><use href="assets/harbor-icons.svg#shop"></use></svg></span><b>낚시 장비</b></button><button data-panel="market"><span class="nav-icon chest"><svg class="harbor-nav-icon" width="21" height="21" aria-hidden="true"><use href="assets/harbor-icons.svg#market"></use></svg></span><b>바로 판매</b><i id="sellDot" hidden></i></button><button data-panel="collection"><span class="nav-icon fishicon"><svg class="harbor-nav-icon" width="21" height="21" aria-hidden="true"><use href="assets/harbor-icons.svg#skills"></use></svg></span><b>물고기 도감</b></button><button data-panel="tank"><span class="nav-icon bucket"><svg class="harbor-nav-icon" width="21" height="21" aria-hidden="true"><use href="assets/harbor-icons.svg#tank"></use></svg></span><b>내 수족관</b></button></nav>
</main>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="modal"><div class="modal-head"><div><small id="modalEyebrow">물결항 낚시일지</small><h2 id="modalTitle"></h2></div><button id="closeModal" aria-label="닫기">✕</button></div><div id="modalBody" class="modal-body"></div></dialog>
<input id="importFile" type="file" accept="application/json,.json" hidden>
<noscript>이 게임은 JavaScript가 필요합니다. 브라우저 설정에서 JavaScript를 켜 주세요.</noscript></body></html>
