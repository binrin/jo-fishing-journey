<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="only light"><meta name="theme-color" content="#123f47"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="조선생의 낚시여행"><meta name="description" content="조선생과 떠나는 30개 낚시터. 캐스팅, 챔질, 보스와의 힘겨루기, 물고기 도감과 수족관을 즐겨요."><title>조선생의 낚시여행</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/app-icon-192.png" type="image/png" sizes="192x192"><link rel="apple-touch-icon" href="assets/apple-touch-icon-180.png" sizes="180x180"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="v2.css"><link rel="stylesheet" href="effects.css"><link rel="stylesheet" href="touch-reel.css"><link rel="stylesheet" href="reel-feedback.css"><link rel="stylesheet" href="water-layout.css"><link rel="stylesheet" href="visual-refresh.css"><script type="module" src="app.js"></script></head>
<body><main class="town-view" id="game" aria-label="조선생의 낚시여행">
 <header class="top"><div class="brand"><span class="brandmark">釣</span><div><small id="headerProgress">Lv.1 · EXP 0 / 200</small><h1>조선생의 <em>낚시여행</em></h1></div></div><button id="homeBtn" class="icon-button" aria-label="마을로 돌아가기">⌂</button><button id="settingsBtn" class="icon-button" aria-label="게임 설정">⚙</button></header>
 <div class="wallet"><span><i class="coin">●</i> <b id="coins">0</b><small>금화</small></span><span id="debt" hidden></span><button id="bagBtn"><span class="mini-icon bucket"></span><b id="bagCount">0 / 20</b><span>선상 수족관 ›</span></button></div>
<section id="townMap" class="town-map" aria-label="물결항 마을 지도">
<div class="town-banner"><small>JO'S FISHING VILLAGE</small><h2>물결항</h2><b id="playerBadge">Lv.1 · 초보 낚시꾼</b><span id="townHP">체력 100 / 100</span><div class="xp-track"><i id="xpBar"></i></div></div>
<button class="map-spot" style="left:20%;top:22%" data-town="shop"><span>장비 · 미끼</span><small>낚시 준비</small></button>
<button class="map-spot" style="left:80%;top:23%" data-town="market"><span>물고기 시장</span><small>바로 판매</small></button>
<button class="map-spot" style="left:50%;top:40%" data-town="skills"><span>낚시 학교</span><small id="mapSP">스킬 배우기</small></button>
<button class="map-spot" style="left:18%;top:48%" data-town="storage"><span>수족관</span><small>물고기 보관</small></button>
<button class="map-spot" style="left:82%;top:49%" data-town="collection"><span>물고기 도감</span><small>240종의 발견</small></button>
<button class="map-spot" style="left:22%;top:68%" data-town="home"><span>내 집</span><small id="mapHome">단칸방 · 잠자기</small></button>
<button class="map-spot" style="left:79%;top:68%" data-town="boats"><span>선박 거래소</span><small>배 구입 · 판매</small></button>
<button class="map-spot departure" style="left:50%;top:86%" data-town="map"><span>낚시 지도 · 출항</span><small id="mapBoat">조각배 · 20칸</small></button>
<p class="map-hint">건물을 터치해서 들어가 보세요</p></section>
 <section id="scene" class="scene" aria-label="낚시터">
  <div class="night-shade"></div><div class="scene-top"><div class="location"><small id="chapter">첫 번째 여행</small><b id="location">솔바람 개울</b></div><button id="clockBtn" class="weather">☀ 낮 · 산들바람</button></div>
  <div id="questChip" class="quest-chip">첫 물고기를 만나 볼까요?</div>
  <div class="ripples r1"></div><div class="ripples r2"></div><div id="bobber" class="bobber"><img src="assets/float.svg" alt="빨간 찌톱과 나무 몸통의 낚시찌" draggable="false"></div>
  <img class="hero" src="assets/hero-rear.png" alt="등을 보이고 앉아 수면을 바라보는 조선생" draggable="false">
  <svg class="fishing-line" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"><path id="fishingLine" d="M240 790 Q420 700 600 640"/></svg>
  <div id="wildFish" class="wild-fish"><div id="fishSprite" class="sprite"></div></div>
  <div id="castGauge" class="cast-gauge" hidden><strong id="castLabel">방향 정하기</strong><div class="cast-track"><span class="perfect-zone"></span><i id="castNeedle"></i></div><small>초록 구간에서 누르면 더 정확해요</small></div>
  <div id="fightLabel" class="fight-label" hidden><span id="fishName">피라미</span><b id="fishDirection">→</b></div>
  <div id="tensionAlert" role="alert" aria-atomic="true"><strong id="tensionAlertTitle">줄이 팽팽해요</strong><span>손을 떼면 줄이 풀려요</span></div>
  <div id="combatEffects" class="combat-effects" aria-hidden="true"></div>
  <div id="sceneMessage" class="scene-message">물결 너머, 새로운 여행이 시작돼요.</div>
  <button id="pauseOverlay" class="pause-overlay" hidden><b>잠깐 쉬는 중</b><span>눌러서 이어하기</span></button>
 </section>
 <div class="journey-row"><button id="baitBtn"><span id="baitText">🪱 기본 미끼</span><small>변경 ›</small></button><button id="bossBtn"><span>✦ 지역 의뢰</span><small id="bossHint">성장 목표</small></button></div>
 <section class="instruments"><div class="meter-row"><label>내 체력 <b id="heroValue">100</b><span class="bar"><i id="heroBar"></i></span></label><label>물고기 <b id="fishValue">—</b><span class="bar fish-bar"><i id="fishBar"></i></span></label></div><div class="tension"><span>줄 긴장</span><div class="bar"><i id="tensionBar"></i><span class="danger-mark"></span></div><b id="tensionValue">0%</b></div></section>
 <div class="active-skills" aria-label="장착 액티브 스킬"><button id="active0"><b>강타</b><small>미습득</small></button><button id="active1"><b>탄력</b><small>미습득</small></button><button id="active2"><b>충격</b><small>미습득</small></button></div>
 <div class="instruction" id="instruction" role="status">낚시 시작을 누르세요</div>
 <section class="controls" aria-label="낚시 조작"><button id="leftBtn" class="reel" aria-label="왼쪽으로 당기기"><b>◀</b><small>왼쪽 당기기</small></button><button id="actionBtn" class="action"><b>낚시 시작</b><small>방향 · 힘 · 챔질</small></button><button id="rightBtn" class="reel" aria-label="오른쪽으로 당기기"><b>▶</b><small>오른쪽 당기기</small></button><div class="reel-status" id="reelStatus" aria-live="off">줄 대기<small>수면 터치 → 감기</small></div><button id="skillBtn" class="skill" aria-label="스킬 학교"><span>✦</span><small>스킬</small><i id="skillFill"></i></button></section>
 <nav class="bottom-nav" aria-label="게임 메뉴"><button data-panel="town"><span class="nav-icon compass"></span><b>마을 지도</b></button><button data-panel="shop"><span class="nav-icon rod"></span><b>낚시 장비</b></button><button data-panel="market"><span class="nav-icon chest"></span><b>바로 판매</b><i id="sellDot" hidden></i></button><button data-panel="collection"><span class="nav-icon fishicon"></span><b>물고기 도감</b></button><button data-panel="aquarium"><span class="nav-icon bucket"></span><b>수족관</b></button></nav>
</main>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="modal"><div class="modal-head"><div><small id="modalEyebrow">조선생의 여행 수첩</small><h2 id="modalTitle"></h2></div><button id="closeModal" aria-label="닫기">✕</button></div><div id="modalBody" class="modal-body"></div></dialog>
<input id="importFile" type="file" accept="application/json,.json" hidden>
<noscript>이 게임은 JavaScript가 필요합니다. 브라우저 설정에서 JavaScript를 켜 주세요.</noscript></body></html>
