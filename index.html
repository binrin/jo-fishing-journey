<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123f47"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="조선생의 낚시여행"><meta name="description" content="조선생과 떠나는 10개 낚시터. 캐스팅, 챔질, 보스와의 힘겨루기, 물고기 도감과 수족관을 즐겨요."><title>조선생의 낚시여행</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="assets/hero.png"><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body><main id="game" aria-label="조선생의 낚시여행">
 <header class="top"><div class="brand"><span class="brandmark">釣</span><div><small>JO'S FISHING JOURNAL</small><h1>조선생의 <em>낚시여행</em></h1></div></div><button id="settingsBtn" class="icon-button" aria-label="게임 설정">⚙</button></header>
 <div class="wallet"><span><i class="coin">●</i> <b id="coins">0</b><small>금화</small></span><span id="debt" hidden></span><button id="bagBtn"><span class="mini-icon bucket"></span><b id="bagCount">0 / 24</b><span>보관함 ›</span></button></div>
 <section id="scene" class="scene" aria-label="낚시터">
  <div class="night-shade"></div><div class="scene-top"><div class="location"><small id="chapter">첫 번째 여행</small><b id="location">모리천</b></div><button id="clockBtn" class="weather">☀ 낮 · 산들바람</button></div>
  <div id="questChip" class="quest-chip">첫 물고기를 만나 볼까요?</div>
  <div class="ripples r1"></div><div class="ripples r2"></div><div id="bobber" class="bobber"><span></span></div>
  <img class="hero" src="assets/hero.png" alt="낚싯대를 든 조선생" draggable="false">
  <div id="wildFish" class="wild-fish"><div id="fishSprite" class="sprite"></div></div>
  <div id="castGauge" class="cast-gauge" hidden><strong id="castLabel">방향 정하기</strong><div class="cast-track"><span class="perfect-zone"></span><i id="castNeedle"></i></div><small>초록 구간에서 누르면 더 정확해요</small></div>
  <div id="fightLabel" class="fight-label" hidden><span id="fishName">피라미</span><b id="fishDirection">→</b></div>
  <div id="sceneMessage" class="scene-message">물결 너머, 새로운 여행이 시작돼요.</div>
  <button id="pauseOverlay" class="pause-overlay" hidden><b>잠깐 쉬는 중</b><span>눌러서 이어하기</span></button>
 </section>
 <div class="journey-row"><button id="baitBtn"><span id="baitText">🪱 기본 미끼</span><small>변경 ›</small></button><button id="bossBtn"><span>✦ 지역 의뢰</span><small id="bossHint">성장 목표</small></button></div>
 <section class="instruments"><div class="meter-row"><label>내 체력 <b id="heroValue">100</b><span class="bar"><i id="heroBar"></i></span></label><label>물고기 <b id="fishValue">—</b><span class="bar fish-bar"><i id="fishBar"></i></span></label></div><div class="tension"><span>줄 긴장</span><div class="bar"><i id="tensionBar"></i><span class="danger-mark"></span></div><b id="tensionValue">0%</b></div></section>
 <div class="instruction" id="instruction" role="status">낚시 시작을 누르세요</div>
 <section class="controls" aria-label="낚시 조작"><button id="leftBtn" class="reel" aria-label="왼쪽으로 당기기"><b>◀</b><small>왼쪽 당기기</small></button><button id="actionBtn" class="action"><b>낚시 시작</b><small>방향 · 힘 · 챔질</small></button><button id="rightBtn" class="reel" aria-label="오른쪽으로 당기기"><b>▶</b><small>오른쪽 당기기</small></button><button id="skillBtn" class="skill" aria-label="차분한 손길 스킬"><span>✦</span><small>스킬</small><i id="skillFill"></i></button></section>
 <nav class="bottom-nav" aria-label="게임 메뉴"><button data-panel="map"><span class="nav-icon compass"></span><b>여행 지도</b></button><button data-panel="shop"><span class="nav-icon rod"></span><b>낚시 장비</b></button><button data-panel="market"><span class="nav-icon chest"></span><b>바로 판매</b><i id="sellDot" hidden></i></button><button data-panel="collection"><span class="nav-icon fishicon"></span><b>물고기 도감</b></button><button data-panel="aquarium"><span class="nav-icon bucket"></span><b>수족관</b></button></nav>
</main>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="modal"><div class="modal-head"><div><small id="modalEyebrow">조선생의 여행 수첩</small><h2 id="modalTitle"></h2></div><button id="closeModal" aria-label="닫기">✕</button></div><div id="modalBody" class="modal-body"></div></dialog>
<input id="importFile" type="file" accept="application/json,.json" hidden>
<noscript>이 게임은 JavaScript가 필요합니다. 브라우저 설정에서 JavaScript를 켜 주세요.</noscript></body></html>
